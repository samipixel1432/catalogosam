{% load static %}
<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso — Premier Bodega Importadora</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{ extend:{
        colors:{
          "primary":"#D4AF37","primary-fixed":"#F2CA50","on-primary":"#1A1200",
          "secondary":"#c5c6ca","surface":"#121414",
          "surface-container":"#1e2020","surface-container-low":"#1a1c1c",
          "surface-container-lowest":"#0c0f0f","surface-container-high":"#282a2b",
          "surface-variant":"#333535","on-surface":"#e2e2e2",
          "on-surface-variant":"#d0c5af","background":"#121414",
          "outline":"#99907c","outline-variant":"#4d4635","tertiary":"#d0cdcd",
          "dorado":"#D4AF37",
        },
        fontFamily:{"body-reg":["Inter"],"spec-mono":["Space Grotesk"],"headline-md":["Inter"]},
        fontSize:{
          "headline-md":["28px",{lineHeight:"1.2",letterSpacing:"-0.01em",fontWeight:"700"}],
          "body-reg":["16px",{lineHeight:"1.6",fontWeight:"400"}],
          "spec-mono":["13px",{lineHeight:"1.5",letterSpacing:"0.06em",fontWeight:"400"}],
        },
        spacing:{"stack-sm":"8px","stack-md":"16px","stack-lg":"32px","gutter":"24px","margin":"48px"},
      }},
    }
  </script>
  <style>
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;vertical-align:middle;}
    input{background:#1e2020!important;color:#e2e2e2!important;border:none!important;border-bottom:1px solid #d0cdcd!important;border-radius:0!important;padding:10px 0!important;}
    input:focus{outline:none!important;border-bottom-color:#D4AF37!important;box-shadow:none!important;}
    input::placeholder{color:#47494d;}
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden px-4">

  <!-- Glow central dorado -->
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <div class="w-[600px] h-[600px] bg-dorado/6 rounded-full blur-[120px]"></div>
  </div>
  <!-- Grid sutil -->
  <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
       style="background-image:linear-gradient(to right,#D4AF37 1px,transparent 1px),linear-gradient(to bottom,#D4AF37 1px,transparent 1px);background-size:32px 32px;"></div>

  <main class="relative z-10 w-full max-w-[440px] flex flex-col gap-8 py-12">

    <!-- Logo + volver -->
    <div class="flex flex-col items-center gap-4">
      <a href="{% url 'catalogo:landing' %}">
        <img src="{% static 'img/logo.png' %}" alt="Premier Bodega Importadora"
             class="w-28 h-28 object-contain drop-shadow-[0_0_30px_rgba(212,175,55,0.25)] hover:scale-105 transition-transform"/>
      </a>
      <h1 class="font-headline-md text-headline-md text-on-surface tracking-widest uppercase text-center">
        Bienvenido
      </h1>
      <p class="font-spec-mono text-spec-mono text-secondary uppercase tracking-widest text-center">
        ¿Cómo deseas ingresar?
      </p>
    </div>

    <!-- ── OPCIÓN 1: INVITADO ── -->
    <div class="flex flex-col gap-3">
      <a href="{% url 'catalogo:coleccion' %}"
         class="group flex items-center gap-4 bg-dorado/10 border border-dorado/40 hover:bg-dorado hover:border-dorado px-6 py-5 transition-all duration-200">
        <div class="w-12 h-12 bg-dorado/20 group-hover:bg-on-primary/20 flex items-center justify-center flex-shrink-0 transition-colors">
          <span class="material-symbols-outlined text-dorado group-hover:text-on-primary text-2xl transition-colors"
                style="font-variation-settings:'FILL' 1">person</span>
        </div>
        <div class="flex-1">
          <p class="font-spec-mono text-spec-mono text-dorado group-hover:text-on-primary uppercase tracking-widest font-bold transition-colors">
            Entrar como Invitado
          </p>
          <p class="text-on-surface-variant group-hover:text-on-primary/70 text-sm mt-0.5 transition-colors">
            Ver el catálogo de productos
          </p>
        </div>
        <span class="material-symbols-outlined text-dorado group-hover:text-on-primary transition-colors">arrow_forward</span>
      </a>
    </div>

    <!-- Separador -->
    <div class="flex items-center gap-4">
      <div class="flex-1 h-px bg-surface-variant"></div>
      <span class="font-spec-mono text-spec-mono text-secondary uppercase tracking-widest text-xs">o</span>
      <div class="flex-1 h-px bg-surface-variant"></div>
    </div>

    <!-- ── OPCIÓN 2: ADMIN ── -->
    <div class="bg-surface-container-low border border-surface-variant p-6">
      <div class="flex items-center gap-3 mb-6">
        <span class="material-symbols-outlined text-secondary">admin_panel_settings</span>
        <p class="font-spec-mono text-spec-mono text-secondary uppercase tracking-widest">Administrador</p>
      </div>

      {% if error %}
      <div class="flex items-center gap-2 bg-red-900/20 border border-red-800/30 text-red-300 px-4 py-3 mb-5 text-sm font-spec-mono font-['Space_Grotesk']">
        <span class="material-symbols-outlined text-base">error</span>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" class="flex flex-col gap-6">
        {% csrf_token %}

        <div class="flex flex-col gap-1">
          <label class="font-spec-mono text-spec-mono text-secondary uppercase tracking-widest text-xs mb-1">
            Usuario
          </label>
          <input type="text" name="username" required autocomplete="username"
                 placeholder="Nombre de usuario"
                 class="w-full font-body-reg text-body-reg"/>
        </div>

        <div class="flex flex-col gap-1">
          <label class="font-spec-mono text-spec-mono text-secondary uppercase tracking-widest text-xs mb-1">
            Contraseña
          </label>
          <input type="password" name="password" required autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full font-body-reg text-body-reg"/>
        </div>

        <button type="submit"
                class="w-full bg-surface-container border border-surface-variant text-on-surface font-spec-mono text-spec-mono uppercase tracking-widest py-4 hover:border-dorado hover:text-dorado transition-colors flex items-center justify-center gap-2 mt-2">
          <span class="material-symbols-outlined text-base">lock_open</span>
          Ingresar al Panel
        </button>
      </form>
    </div>

    <!-- Volver -->
    <p class="text-center">
      <a href="{% url 'catalogo:landing' %}"
         class="font-spec-mono text-spec-mono text-secondary hover:text-dorado uppercase tracking-widest transition-colors flex items-center justify-center gap-1">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        Volver al inicio
      </a>
    </p>

  </main>
</body>
</html>
